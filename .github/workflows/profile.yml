name: Profile stats

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_stats.py, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: output
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stats SVGs (GitHub + LeetCode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats.py "${{ github.repository_owner }}" dist
      - name: Publish to the output branch
        run: |
          mkdir -p out/profile
          cp dist/*.svg out/profile/   # a failed LeetCode fetch keeps the previous card
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -q -m "Stats snapshot"
          git push -q origin HEAD:output
