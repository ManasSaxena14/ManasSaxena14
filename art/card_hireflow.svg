<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="HireFlow: A two-sided hiring platform and applicant tracking system">
<title>HireFlow · A two-sided hiring platform and applicant tracking system</title>
<defs>
  <clipPath id="clip-hireflow"><rect x="1" y="1" width="998" height="318" rx="16"/></clipPath>
  <radialGradient id="rg-hireflow" cx="1" cy="0" r=".75"><stop offset="0" stop-color="#c8f25a" stop-opacity=".055"/><stop offset="1" stop-color="#c8f25a" stop-opacity="0"/></radialGradient>
</defs>
<style><![CDATA[
  @keyframes up { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:none} }@keyframes fade { from {opacity:0} to {opacity:1} }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .idx { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #c8f25a; }
  .cat { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #8b8b94; }
  .ti { font: 700 30px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.8px; fill: #fafafa; }
  .st { font: italic 400 19px 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif; fill: #c4c4cc; }
  .d { font: 400 13.5px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a1a1aa; }
  .mn { font: 600 24px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.5px; fill: #fafafa; }
  .ml { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .6px; fill: #8b8b94; }
  .pl { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #c4c4cc; }
  .chip { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.4px; fill: #c4c4cc; }
]]></style>
<g clip-path="url(#clip-hireflow)">
  <rect width="1000" height="320" fill="#111113"/>
  <rect width="1000" height="320" fill="url(#rg-hireflow)"/>
  <g >
    <text class="idx" x="28" y="40">01</text>
    <text class="cat" x="56" y="40">FEATURED · HIRING PLATFORM + ATS</text>
    <rect x="912.4" y="24" width="59.6" height="24" rx="12" fill="none" stroke="#27272a"/>
    <circle cx="926.4" cy="36" r="3" fill="#c8f25a"/>
    <text class="chip" x="935.4" y="40">LIVE</text>
  </g>
  <g >
    <text class="ti" x="27" y="86">HireFlow</text>
    <text class="st" x="28" y="114">A two-sided hiring platform and applicant tracking system</text>
  </g>
  <g ><text class="d" x="28" y="140">Job seekers track every application; companies post jobs, run their hiring pipeline and book interviews with 4-role RBAC.</text><text class="d" x="28" y="160">Double-booking is impossible via Postgres exclusion constraints (verified at 20 concurrent bookings); resumes scored by TF-IDF.</text></g>
  <line x1="28" y1="190" x2="972" y2="190" stroke="#1e1e22"/><g >
  <text class="mn" x="28.0" y="228">441</text>
  <text class="ml" x="28.0" y="246">tests in CI</text></g><line x1="263.0" y1="204" x2="263.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="282.0" y="228">97%</text>
  <text class="ml" x="282.0" y="246">API coverage</text></g><line x1="499.0" y1="204" x2="499.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="518.0" y="228">&lt;25ms</text>
  <text class="ml" x="518.0" y="246">p95 at 50 concurrent users</text></g><line x1="735.0" y1="204" x2="735.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="754.0" y="228">7</text>
  <text class="ml" x="754.0" y="246">pg-boss job queues</text></g>
  <g ><rect x="28.0" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="63.2" y="286" text-anchor="middle">Next.js</text><rect x="106.3" y="270" width="63.4" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="138.0" y="286" text-anchor="middle">NestJS</text><rect x="177.7" y="270" width="91.0" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="223.2" y="286" text-anchor="middle">PostgreSQL</text><rect x="276.7" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="311.9" y="286" text-anchor="middle">pg-boss</text><rect x="355.0" y="270" width="63.4" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="386.7" y="286" text-anchor="middle">TF-IDF</text><rect x="426.4" y="270" width="49.6" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="451.2" y="286" text-anchor="middle">RBAC</text><rect x="484.0" y="270" width="63.4" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="515.7" y="286" text-anchor="middle">Vercel</text><rect x="555.4" y="270" width="63.4" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="587.1" y="286" text-anchor="middle">Render</text></g>
</g>
<rect x=".5" y=".5" width="999" height="319" rx="16" fill="none" stroke="#27272a"/>
</svg>