<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-label="BidVerse: A MERN auction marketplace">
<title>BidVerse · A MERN auction marketplace</title>
<defs>
  <clipPath id="clip-bidverse"><rect x="1" y="1" width="498" height="318" rx="16"/></clipPath>
  <radialGradient id="rg-bidverse" cx="1" cy="0" r=".75"><stop offset="0" stop-color="#c8f25a" stop-opacity=".055"/><stop offset="1" stop-color="#c8f25a" stop-opacity="0"/></radialGradient>
</defs>
<style><![CDATA[
  @keyframes up { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:none} }@keyframes fade { from {opacity:0} to {opacity:1} }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .idx { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #c8f25a; }
  .cat { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #8b8b94; }
  .ti { font: 700 30px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.8px; fill: #fafafa; }
  .st { font: italic 400 19px 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif; fill: #c4c4cc; }
  .d { font: 400 13.5px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a1a1aa; }
  .mn { font: 600 24px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.5px; fill: #fafafa; }
  .ml { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .6px; fill: #8b8b94; }
  .pl { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #c4c4cc; }
  .chip { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.4px; fill: #c4c4cc; }
]]></style>
<g clip-path="url(#clip-bidverse)">
  <rect width="500" height="320" fill="#111113"/>
  <rect width="500" height="320" fill="url(#rg-bidverse)"/>
  <g >
    <text class="idx" x="28" y="40">03</text>
    <text class="cat" x="56" y="40">REAL-TIME MARKETPLACE</text>
    <rect x="412.4" y="24" width="59.6" height="24" rx="12" fill="none" stroke="#27272a"/>
    <circle cx="426.4" cy="36" r="3" fill="#c8f25a"/>
    <text class="chip" x="435.4" y="40">LIVE</text>
  </g>
  <g >
    <text class="ti" x="27" y="86">BidVerse</text>
    <text class="st" x="28" y="114">A MERN auction marketplace</text>
  </g>
  <g ><text class="d" x="28" y="140">Race-safe bidding: simultaneous equal bids resolve to one</text><text class="d" x="28" y="160">winner and one HTTP 409. Idempotent bids, auto-settled fees.</text></g>
  <line x1="28" y1="190" x2="472" y2="190" stroke="#1e1e22"/><g >
  <text class="mn" x="28.0" y="228">30+</text>
  <text class="ml" x="28.0" y="246">REST APIs</text></g><line x1="175.0" y1="204" x2="175.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="194.0" y="228">16</text>
  <text class="ml" x="194.0" y="246">pages shipped</text></g><line x1="323.0" y1="204" x2="323.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="342.0" y="228">6</text>
  <text class="ml" x="342.0" y="246">Mongo pipelines</text></g>
  <g ><rect x="28.0" y="270" width="56.5" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="56.2" y="286" text-anchor="middle">React</text><rect x="92.5" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="127.7" y="286" text-anchor="middle">Node.js</text><rect x="170.8" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="206.0" y="286" text-anchor="middle">Express</text><rect x="249.1" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="284.2" y="286" text-anchor="middle">MongoDB</text><rect x="327.4" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="362.6" y="286" text-anchor="middle">Groq AI</text></g>
</g>
<rect x=".5" y=".5" width="499" height="319" rx="16" fill="none" stroke="#27272a"/>
</svg>