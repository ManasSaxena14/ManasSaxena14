<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-label="Orbyt: A self-hosted, OpenAI-compatible LLM gateway">
<title>Orbyt · A self-hosted, OpenAI-compatible LLM gateway</title>
<defs>
  <clipPath id="clip-orbyt"><rect x="1" y="1" width="498" height="318" rx="16"/></clipPath>
  <radialGradient id="rg-orbyt" cx="1" cy="0" r=".75"><stop offset="0" stop-color="#c8f25a" stop-opacity=".055"/><stop offset="1" stop-color="#c8f25a" stop-opacity="0"/></radialGradient>
</defs>
<style><![CDATA[
  @keyframes up { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:none} }@keyframes fade { from {opacity:0} to {opacity:1} }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .idx { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #c8f25a; }
  .cat { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #8b8b94; }
  .ti { font: 700 30px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.8px; fill: #fafafa; }
  .st { font: italic 400 19px 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif; fill: #c4c4cc; }
  .d { font: 400 13.5px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a1a1aa; }
  .mn { font: 600 24px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.5px; fill: #fafafa; }
  .ml { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .6px; fill: #8b8b94; }
  .pl { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #c4c4cc; }
  .chip { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.4px; fill: #c4c4cc; }
]]></style>
<g clip-path="url(#clip-orbyt)">
  <rect width="500" height="320" fill="#111113"/>
  <rect width="500" height="320" fill="url(#rg-orbyt)"/>
  <g >
    <text class="idx" x="28" y="40">05</text>
    <text class="cat" x="56" y="40">LLM INFRASTRUCTURE</text>
    <rect x="412.4" y="24" width="59.6" height="24" rx="12" fill="none" stroke="#27272a"/>
    <circle cx="426.4" cy="36" r="3" fill="#c8f25a"/>
    <text class="chip" x="435.4" y="40">LIVE</text>
  </g>
  <g >
    <text class="ti" x="27" y="86">Orbyt</text>
    <text class="st" x="28" y="114">A self-hosted, OpenAI-compatible LLM gateway</text>
  </g>
  <g ><text class="d" x="28" y="140">Drop-in /v1/chat/completions with fallback chains, BYOK,</text><text class="d" x="28" y="160">cost and latency routing over a Redis key pool, SSE tracing.</text></g>
  <line x1="28" y1="190" x2="472" y2="190" stroke="#1e1e22"/><g >
  <text class="mn" x="28.0" y="228">40+</text>
  <text class="ml" x="28.0" y="246">error classes</text></g><line x1="175.0" y1="204" x2="175.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="194.0" y="228">5 + 7</text>
  <text class="ml" x="194.0" y="246">apps + packages</text></g><line x1="323.0" y1="204" x2="323.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="342.0" y="228">SSE</text>
  <text class="ml" x="342.0" y="246">live tracing</text></g>
  <g ><rect x="28.0" y="270" width="91.0" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="73.5" y="286" text-anchor="middle">TypeScript</text><rect x="127.0" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="162.2" y="286" text-anchor="middle">Next.js</text><rect x="205.3" y="270" width="56.5" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="233.6" y="286" text-anchor="middle">Redis</text><rect x="269.8" y="270" width="63.4" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="301.5" y="286" text-anchor="middle">Prisma</text><rect x="341.2" y="270" width="91.0" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="386.7" y="286" text-anchor="middle">PostgreSQL</text></g>
</g>
<rect x=".5" y=".5" width="499" height="319" rx="16" fill="none" stroke="#27272a"/>
</svg>