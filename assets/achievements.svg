  @keyframes pulse { 0%,100% {fill-opacity:.06;stroke-opacity:1} 50% {fill-opacity:.22;stroke-opacity:.5} }
  @keyframes sw { from {stroke-dashoffset:0} to {stroke-dashoffset:-1000} }
]]></style>
