<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-label="RHoMIS Analytics: Food security across 35 countries">
<title>RHoMIS Analytics · Food security across 35 countries</title>
<defs>
  <clipPath id="clip-rhomis"><rect x="1" y="1" width="498" height="318" rx="16"/></clipPath>
  <radialGradient id="rg-rhomis" cx="1" cy="0" r=".75"><stop offset="0" stop-color="#c8f25a" stop-opacity=".055"/><stop offset="1" stop-color="#c8f25a" stop-opacity="0"/></radialGradient>
</defs>
<style><![CDATA[
  @keyframes up { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:none} }@keyframes fade { from {opacity:0} to {opacity:1} }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .idx { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #c8f25a; }
  .cat { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #8b8b94; }
  .ti { font: 700 30px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.8px; fill: #fafafa; }
  .st { font: italic 400 19px 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif; fill: #c4c4cc; }
  .d { font: 400 13.5px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a1a1aa; }
  .mn { font: 600 24px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.5px; fill: #fafafa; }
  .ml { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .6px; fill: #8b8b94; }
  .pl { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #c4c4cc; }
  .chip { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.4px; fill: #c4c4cc; }
]]></style>
<g clip-path="url(#clip-rhomis)">
  <rect width="500" height="320" fill="#111113"/>
  <rect width="500" height="320" fill="url(#rg-rhomis)"/>
  <g >
    <text class="idx" x="28" y="40">07</text>
    <text class="cat" x="56" y="40">DATA SCIENCE · TEAM</text>
    <rect x="390.2" y="24" width="81.8" height="24" rx="12" fill="none" stroke="#27272a"/>
    <circle cx="404.2" cy="36" r="3" fill="#c8f25a"/>
    <text class="chip" x="413.2" y="40">TABLEAU</text>
  </g>
  <g >
    <text class="ti" x="27" y="86">RHoMIS Analytics</text>
    <text class="st" x="28" y="114">Food security across 35 countries</text>
  </g>
  <g ><text class="d" x="28" y="140">Team capstone: ETL from 1,599 variables to 46 indicators,</text><text class="d" x="28" y="160">chi-square, logistic regression and k-means profiling.</text></g>
  <line x1="28" y1="190" x2="472" y2="190" stroke="#1e1e22"/><g >
  <text class="mn" x="28.0" y="228">54,873</text>
  <text class="ml" x="28.0" y="246">households</text></g><line x1="175.0" y1="204" x2="175.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="194.0" y="228">35</text>
  <text class="ml" x="194.0" y="246">countries</text></g><line x1="323.0" y1="204" x2="323.0" y2="244" stroke="#1e1e22"/><g >
  <text class="mn" x="342.0" y="228">7</text>
  <text class="ml" x="342.0" y="246">KPIs on Tableau</text></g>
  <g ><rect x="28.0" y="270" width="63.4" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="59.7" y="286" text-anchor="middle">Python</text><rect x="99.4" y="270" width="104.8" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="151.8" y="286" text-anchor="middle">scikit-learn</text><rect x="212.2" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="247.4" y="286" text-anchor="middle">K-Means</text><rect x="290.5" y="270" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="325.6" y="286" text-anchor="middle">Tableau</text></g>
</g>
<rect x=".5" y=".5" width="499" height="319" rx="16" fill="none" stroke="#27272a"/>
</svg>