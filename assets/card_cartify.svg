<svg xmlns="http://www.w3.org/2000/svg" width="500" height="214" viewBox="0 0 500 214" role="img" aria-label="CARTIFY AI — AI-powered e-commerce platform">
<title>CARTIFY AI — AI-powered e-commerce platform</title>
<defs>
  <clipPath id="clip-cartify"><rect x="1" y="1" width="498" height="212" rx="14"/></clipPath>
  <radialGradient id="rg-cartify" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".22"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
  <radialGradient id="rg2-cartify" cx="0" cy="1" r=".8"><stop offset="0" stop-color="#00f0ff" stop-opacity=".12"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="sb-cartify" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/><stop offset=".5" stop-color="#ff2bd6" stop-opacity=".09"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
  <pattern id="grid-cartify" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <filter id="g-cartify" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style><![CDATA[
  .tag { font: 700 11px 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 2px; fill: #ff2bd6; }
  .ti { font: 900 30px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #e6f1ff; }
  .st { font: 600 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c9d1ff; }
  .d { font: 400 13px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8a96b8; }
  .mn { font: 800 22px 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  .ml { font: 500 10.5px 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8a96b8; letter-spacing: .5px; }
  .pl { font: 600 11px 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #c9d1ff; }
  .chip { font: 700 10.5px 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 2px; fill: #39ff14; }
  .sweep1 { stroke-dasharray: 110 890; animation: sw 6s linear infinite; }
  .sweep2 { stroke-dasharray: 60 940; animation: sw 6s linear infinite; animation-delay: -3s; }
  .scan { animation: scan 4.5s linear infinite; }
  .m { animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
  .mbar { transform-box: fill-box; transform-origin: left; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  .dot { animation: blink 1.4s ease-in-out infinite; }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.8s ease-out infinite; }
  .gl { animation: gl 6s steps(1) infinite; }
  .br { animation: br 3s ease-in-out infinite; }
  @keyframes sw { from {stroke-dashoffset:0} to {stroke-dashoffset:-1000} }
  @keyframes scan { from {transform:translateY(-70px)} to {transform:translateY(224px)} }
  @keyframes up { from {opacity:0;transform:translateY(10px)} to {opacity:1;transform:none} }
  @keyframes grow { from {transform:scaleX(0)} to {transform:scaleX(1)} }
  @keyframes blink { 0%,100% {opacity:1} 50% {opacity:.3} }
  @keyframes ring { from {transform:scale(1);opacity:.8} to {transform:scale(3);opacity:0} }
  @keyframes gl { 0%,92%,100% {opacity:0;transform:none} 93% {opacity:.8;transform:translate(-4px,0)} 95% {opacity:.8;transform:translate(3px,1px)} 97% {opacity:0} }
  @keyframes br { 0%,100% {opacity:.9} 50% {opacity:.35} }
]]></style>
<g clip-path="url(#clip-cartify)">
  <rect width="500" height="214" fill="#0a0a18"/>
  <rect width="500" height="214" fill="url(#grid-cartify)"/>
  <rect width="500" height="214" fill="url(#rg-cartify)"/><rect width="500" height="214" fill="url(#rg2-cartify)"/>
  <rect class="scan" width="500" height="70" fill="url(#sb-cartify)"/>
  <text class="tag" x="24" y="36">10 // AI E-COMMERCE</text>
  <g>
    <rect x="410.0" y="21" width="66.0" height="22" rx="11" fill="#0d1f12" stroke="#39ff14" stroke-opacity=".5"/>
    <circle class="ring" cx="423.0" cy="32" r="3.5" fill="none" stroke="#39ff14"/>
    <circle class="dot" cx="423.0" cy="32" r="3.5" fill="#39ff14"/>
    <text class="chip" x="433.0" y="36">LIVE</text>
  </g>
  <text class="ti" x="24" y="80" filter="url(#g-cartify)">CARTIFY AI</text>
  <text class="ti gl" x="24" y="80" style="fill:#00f0ff">CARTIFY AI</text>
  <text class="st" x="24" y="104">AI-powered e-commerce platform</text>
  <text class="d" x="24" y="130">Conversational shopping assistant, personalised</text><text class="d" x="24" y="148">recommendations and intelligent search filtering.</text>
  
  <rect x="24.0" y="166" width="71.1" height="24" rx="12" fill="none" stroke="#ff2bd6" stroke-opacity=".45"/><text class="pl" x="59.5" y="182" text-anchor="middle">MongoDB</text><rect x="103.1" y="166" width="71.1" height="24" rx="12" fill="none" stroke="#ff2bd6" stroke-opacity=".45"/><text class="pl" x="138.6" y="182" text-anchor="middle">Express</text><rect x="182.2" y="166" width="56.5" height="24" rx="12" fill="none" stroke="#ff2bd6" stroke-opacity=".45"/><text class="pl" x="210.4" y="182" text-anchor="middle">React</text><rect x="246.7" y="166" width="71.1" height="24" rx="12" fill="none" stroke="#ff2bd6" stroke-opacity=".45"/><text class="pl" x="282.2" y="182" text-anchor="middle">Node.js</text>
  <g class="br" fill="none" stroke="#ff2bd6" stroke-width="2">
    <path d="M8 26 V8 H26"/><path d="M474 206 H492 V188"/>
  </g>
</g>
<rect x="1" y="1" width="498" height="212" rx="14" fill="none" stroke="#1d1d3a" stroke-width="1.5"/>
<rect class="sweep1" x="1" y="1" width="498" height="212" rx="14" fill="none" stroke="#ff2bd6" stroke-width="2.5" pathLength="1000" filter="url(#g-cartify)"/>
<rect class="sweep2" x="1" y="1" width="498" height="212" rx="14" fill="none" stroke="#00f0ff" stroke-width="2" pathLength="1000" filter="url(#g-cartify)"/>
</svg>