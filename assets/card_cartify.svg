<svg xmlns="http://www.w3.org/2000/svg" width="500" height="238" viewBox="0 0 500 238" role="img" aria-label="Cartify AI: AI-powered e-commerce platform">
<title>Cartify AI · AI-powered e-commerce platform</title>
<defs>
  <clipPath id="clip-cartify"><rect x="1" y="1" width="498" height="236" rx="16"/></clipPath>
  <radialGradient id="rg-cartify" cx="1" cy="0" r=".75"><stop offset="0" stop-color="#c8f25a" stop-opacity=".055"/><stop offset="1" stop-color="#c8f25a" stop-opacity="0"/></radialGradient>
</defs>
<style><![CDATA[
  @keyframes up { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:none} }@keyframes fade { from {opacity:0} to {opacity:1} }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .idx { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #c8f25a; }
  .cat { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #8b8b94; }
  .ti { font: 700 30px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.8px; fill: #fafafa; }
  .st { font: italic 400 19px 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif; fill: #c4c4cc; }
  .d { font: 400 13.5px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a1a1aa; }
  .mn { font: 600 24px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -.5px; fill: #fafafa; }
  .ml { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: .6px; fill: #8b8b94; }
  .pl { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #c4c4cc; }
  .chip { font: 500 10.5px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.4px; fill: #c4c4cc; }
]]></style>
<g clip-path="url(#clip-cartify)">
  <rect width="500" height="238" fill="#111113"/>
  <rect width="500" height="238" fill="url(#rg-cartify)"/>
  <g >
    <text class="idx" x="28" y="40">10</text>
    <text class="cat" x="56" y="40">AI E-COMMERCE</text>
    <rect x="412.4" y="24" width="59.6" height="24" rx="12" fill="none" stroke="#27272a"/>
    <circle cx="426.4" cy="36" r="3" fill="#c8f25a"/>
    <text class="chip" x="435.4" y="40">LIVE</text>
  </g>
  <g >
    <text class="ti" x="27" y="86">Cartify AI</text>
    <text class="st" x="28" y="114">AI-powered e-commerce platform</text>
  </g>
  <g ><text class="d" x="28" y="140">A conversational shopping assistant, personalised</text><text class="d" x="28" y="160">recommendations and intelligent search filtering.</text></g>
  
  <g ><rect x="28.0" y="188" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="63.2" y="204" text-anchor="middle">MongoDB</text><rect x="106.3" y="188" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="141.5" y="204" text-anchor="middle">Express</text><rect x="184.6" y="188" width="56.5" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="212.9" y="204" text-anchor="middle">React</text><rect x="249.1" y="188" width="70.3" height="24" rx="12" fill="#18181b" stroke="#27272a"/><text class="pl" x="284.2" y="204" text-anchor="middle">Node.js</text></g>
</g>
<rect x=".5" y=".5" width="499" height="237" rx="16" fill="none" stroke="#27272a"/>
</svg>