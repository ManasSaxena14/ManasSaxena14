  <circle cx="930" cy="70" r="4" fill="#c8f25a" />
  <circle cx="930" cy="70" r="4" fill="none" stroke="#c8f25a" class="pulse"/>
  <circle r="2.6" fill="#c8f25a" class="sig"/>

