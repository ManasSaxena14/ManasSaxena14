  <linearGradient id="fadeR" x1="0" x2="1"><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="dotMask"><rect width="1000" height="320" fill="url(#fadeR)"/></mask>
  <radialGradient id="halo" cx=".86" cy=".2" r=".55"><stop offset="0" stop-color="#c8f25a" stop-opacity=".07"/><stop offset="1" stop-color="#c8f25a" stop-opacity="0"/></radialGradient>
</defs>
<style><![CDATA[
  @keyframes up { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:none} }@keyframes fade { from {opacity:0} to {opacity:1} }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .meta { font: 500 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.6px; fill: #8b8b94; }
  .first { font: 700 86px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #fafafa; }
  .last { font: italic 400 92px 'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif; letter-spacing: -1px; fill: #e4e4e7; }
  .role { font: 500 19px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e4e4e7; }
  .sub { font: 400 14px 'Inter', 'Geist', 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a1a1aa; }
  .sig { offset-path: path("M640 186 H730 L748 168 V128 L766 110 H840 L858 92 V70 H930"); animation: sig 6s 1s ease-in-out infinite; opacity: 0; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out infinite; }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  @keyframes sig { 0% {offset-distance:0%;opacity:0} 8% {opacity:1} 55% {offset-distance:100%;opacity:1} 62%,100% {offset-distance:100%;opacity:0} }
  @keyframes pulse { 0% {transform:scale(1);opacity:.6} 70%,100% {transform:scale(3.2);opacity:0} }
]]></style>
<g clip-path="url(#clip)">
